# Cordis Agent Core — core service plus n8n (Phase 6, architecture doc §8.1).
# Run from the repo root: `docker compose -f deploy/docker-compose.yml up --build`.
#
# n8n integration is OFF by default even with this service running: core's
# own cordis-n8n plugin (packages/tool/n8n/src/index.ts, its own
# @cordis-app/tool-n8n package) is not part of the shipped composition —
# insert it plus @deepseek-ai/dsh-webhook (its
# undeclared runtime dependency, confirmed for real: boot fails
# "waiting for service: webhookRuntime" without it) via
# data/harness/profiles/cordis-app/cordis.patch.yml, matching the opt-in
# pattern from docs/patch-cookbook.md. baseURL then points at
# `http://n8n:5678` (the service name below, reachable over the compose
# network — not 127.0.0.1, which only works from the host or from n8n's own
# container).
services:
  n8n:
    image: docker.n8n.io/n8nio/n8n:latest
    volumes:
      - n8n-data:/home/node/.n8n
    ports:
      - "127.0.0.1:5678:5678"   # editor UI — loopback only, same posture as `core`
    environment:
      # Quiets n8n's own marketing/onboarding surface for a self-hosted,
      # single-tenant deployment — confirmed for real against a live n8n
      # 2.38.7 instance (GET /rest/settings before/after): every one of
      # these actually flips its matching settings field to false, none of
      # them affect workflow/tool functionality. N8N_TEMPLATES_ENABLED also
      # removes the templates marketplace panel (a real feature, not just
      # an ad) — flip it back to true if you want template browsing.
      N8N_DIAGNOSTICS_ENABLED: "false"            # telemetry + posthog + dynamicBanners (the "buy n8n" upsell banner)
      N8N_PERSONALIZATION_ENABLED: "false"        # the first-login "tell us about yourself" onboarding survey popup
      N8N_VERSION_NOTIFICATIONS_ENABLED: "false"  # "update available" popup
      N8N_VERSION_NOTIFICATIONS_WHATS_NEW_ENABLED: "false"  # separate flag from the line above — confirmed both needed
      N8N_HIRING_BANNER_ENABLED: "false"
      N8N_TEMPLATES_ENABLED: "false"
      # Real bug found and fixed (user: OAuth2 "Error: Unauthorized" connecting
      # a Google node, at http://localhost:5678/rest/oauth2-credential/callback).
      # Root cause confirmed by reading n8n's own source (@n8n/config's
      # GlobalConfig, services/url.service.js): with N8N_EDITOR_BASE_URL and
      # WEBHOOK_URL both unset, n8n's OAuth redirect_uri is computed ONCE at
      # boot from N8N_HOST, which defaults to the hardcoded string
      # `'localhost'` — NOT from the Host header of whichever origin the
      # browser actually used. This app's editorBaseURL (cordis.patch.yml)
      # and this very port mapping both standardize on 127.0.0.1, so a user
      # logged into n8n at http://127.0.0.1:5678 (a real auth cookie for that
      # origin) gets redirected back by Google to http://localhost:5678/...
      # — a DIFFERENT origin n8n's own cookie isn't sent to — landing
      # without a session. n8n's oauth.service.js then throws exactly
      # `AuthError('Unauthorized')` when decodeCsrfState finds no req.user.
      # Setting this explicitly makes n8n's own computed base URL agree with
      # where the user actually logs in, everywhere in this app.
      N8N_EDITOR_BASE_URL: "http://127.0.0.1:5678"
    restart: unless-stopped

  core:
    image: cordis-core:dev
    build:
      context: ..
      dockerfile: deploy/core.Dockerfile
    # Repo-root .env (copy from .env.example) — OPENAI_API_KEY/BASE_URL/
    # MODEL_ID/EXTRA_BODY/CONTEXT_WINDOW. `required: false` so `docker
    # compose up` still works before a user has created one; env_file only
    # sets keys actually present in the file (unlike `environment:
    # ${VAR:-}`, which would force every var to an empty string when unset —
    # worse than not setting it at all for dsh-credentials-local's own
    # env-vs-unset fallback logic).
    env_file:
      - path: ../.env
        required: false
    volumes:
      # Bind mount, not a named volume — this is the point (architecture doc
      # §5): `data/harness/profiles/cordis-app/cordis.patch.yml` (repo root,
      # not deploy/ — relative paths here resolve against this file's own
      # directory, so `../` keeps state as a repo-root sibling of deploy/,
      # not nested inside it) is edited from the host, then `docker compose
      # restart core` picks it up.
      - ../data/harness:/data/harness
      - workspace:/workspace
    ports:
      - "127.0.0.1:3080:3080"   # loopback only — see architecture doc §2.3 for remote access
    # No IPv6 here, declared rather than left implicit. dsh-web-fetch-http probes
    # for a NAT64 prefix (ipv4only.arpa) whenever a hostname resolves with an
    # IPv6 record, then synthesises v6 addresses that embed the v4 one. On
    # 2026-09-18 one web_fetch did exactly that, got ENETUNREACH on
    # 2606:4700:20::681a:5dc (= 104.26.5.220), and the unhandled socket error
    # ended the process — the container restarted and every live chat dropped.
    # With IPv6 off the probe finds nothing and that path never runs.
    sysctls:
      - net.ipv6.conf.all.disable_ipv6=1
      - net.ipv6.conf.default.disable_ipv6=1
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    restart: unless-stopped

volumes:
  workspace:
  n8n-data:
