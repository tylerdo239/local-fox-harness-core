# Bundle-tier patch for @cordis-app/bundle-core.
#
# This is composition, not a tunable — rebuild-tier, not the live profile
# patch at $DSH_HOME/profiles/cordis-app/cordis.patch.yml (see
# docs/cordis-agent-implementation-plan.md §7 in the parent local-agent-core
# checkout). Two things happen here:
#
# 1. Disable every row @deepseek-ai/dsh-web-app contributes for its own
#    shipped React client (the "ui-*" roster + client-hmr + the open-in-app
#    helper tied to that client). Cordis Agent Core ships its own Next.js
#    frontend instead (see P1, apps/web/). List regenerated from a real
#    `dsh --profile web --dump-config` run — do not hand-edit without
#    re-deriving it the same way if dsh-web-app's row set changes upstream.
# 2. Insert our own plugins as new rows.
#
# 3. Disable modules/cordis-client-runner/api-remotes — resolved during
#    Phase 2, not left undecided anymore. Root cause found by testing for
#    real: ctx.webServer.renderIndex() (which cordis-ui's route calls on OUR
#    OWN index.html) runs the shared webserver/index-inject collection
#    across EVERY active subscriber, so leaving dsh-client-modules mounted
#    injected its window.__ModuleLoader__/__DSH_BOOT__ bootstrap into our
#    page even though nothing of ours calls it — confirmed by curling root
#    and finding that script present alongside our own Next.js chunks.
#    file-upload stays enabled: @deepseek-ai/dsh-api-session-controller
#    injects it as a hard dependency (`waiting for service: fileUploads`
#    boot failure, hit for real) — harmless unused row, not worth chasing
#    that dependency chain further for a static export with no upload UI.

