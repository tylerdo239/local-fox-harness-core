# Cloned per user request (docs/cordis-ui-clone-plan.md's "clone plugin"
# ask): re-enable dsh-base's own `tool-web`/`web` rows for real web search.
# `tool-web` (the model-facing `web_search` tool) arrives `disabled: true`
# from dsh-web-app's own patch layer (pre-existing, unrelated to this
# change — confirmed via a real `dsh --profile cordis-app --dump-config`
# run) — without re-enabling it the model has no tool to call at all, even
# with a search source registered below. A patch replaces a row's WHOLE
# `config`, so every key the row owns is restated here, not just the one
# being changed (same convention dsh-web-app's own patch.yml documents).
- id: tool-web
  name: '@deepseek-ai/dsh-tool-web'
  config:
    fetch: true
    searchTimeoutMs: 60000
    # 30_000 (the package default) is short for a slow origin: measured on
    # blog.mean.ceo, a good run takes 8.1s and bad ones crossed 30s twice in one
    # turn, costing the model two wasted steps on "tool call timed out". Matched
    # to searchTimeoutMs above.
    fetchTimeoutMs: 60000
    # The second raw-HTML cut: renderBody() slices the body at this value BEFORE
    # turndown runs, so it truncates markup, not text — same reason maxBodyChars
    # above is no longer the budget. Raised past any real page; cordis-web-clean
    # is what bounds the result the model reads.
    fetchMaxOutputChars: 5000000
  disabled: false
- id: web
  name: '@deepseek-ai/dsh-web'
  config:
    searchProvider: serper
    fetchProvider: http

# How much of a fetched page reaches the model. The package's own default is
# 100_000 characters — sized for a model with a 200k+ window, not for the 32_000
# this deployment declares: measured 2026-09-18, one ordinary Wikipedia page came
# back at 22_401 characters (~6_400 tokens, a fifth of the window) and the
# default cap allows nearly four times that from a single call. The turn that
# found the NAT64 crash had called web_fetch three times in a row.
#
# 8_000 was tried first, to match tool-result-pruner's threshold above, and
# MEASURED WRONG: the same Wikipedia page came back as 229 characters — its
# title plus "(Content truncated...)" — and the model then answered from its own
# training data as if it had read the page. The reason is where the cap applies,
# in dsh-web-fetch-http's own body handling:
#   const decoded = decoder.decode(bytes);
#   const content = truncatedByChars ? decoded.slice(0, maxBodyChars) : decoded;
#   const body = kind === "html" ? { kind: "html", content } : ...
# It slices the RAW HTML and extracts text afterwards, so the budget is spent on
# <head>, stylesheets and nav before any prose. Measured ratio on that page:
# 100_000 raw HTML -> 22_400 characters of text, about 22%. 40_000 therefore
# yields roughly 9_000 characters (~2_600 tokens) of readable text, while the
# worst case — a plain-text document, where the cap is all prose — is 40_000
# characters (~11_400 tokens), still far under the 100_000 default's ~28_500.
- id: web-fetch-http
  name: '@deepseek-ai/dsh-web-fetch-http'
  config:
    # Deliberately not the budget any more — see src/web-clean.ts. This cap
    # slices RAW HTML, so any value small enough to bound cost also cuts before
    # the article starts; 40_000 left the Nokia page with nothing but its
    # navigation. Raised past `maxResponseBytes` (5 MB, the provider's real
    # guard, unchanged) so it never binds, and cordis-web-clean caps the
    # extracted prose instead.
    maxBodyChars: 5000000

# Real bug reported: chat in Vietnamese, agent replies in English. Root
# cause found — dsh-web-app's own default persona (personaPrefix/Suffix
# below, confirmed via a real --dump-config) is entirely in English with no
# instruction at all about matching the user's language, so a model with no
# strong language-consistency prior of its own defaults to English. A patch
# entry replaces the WHOLE row config, so personaPrefix is restated
# unchanged — only personaSuffix gains the new sentence.
- id: system-prompt
  name: '@deepseek-ai/dsh-system-prompt'
  config:
    personaPrefix: You are a coding agent powered by the {{model}} model.
    personaSuffix: >-
      Your working directory is {{cwd}}. Always reply in the same language
      the user's message is written in — match it exactly (e.g. Vietnamese
      in, Vietnamese out; English in, English out), even if it changes
      mid-conversation, regardless of what language your own reasoning or
      tool calls use internally.

# Built-in skills (packages/skills, cloned from example-2 — verbatim, no
# fox-harness-specific content) plus the real "user-dsh" root
# ($DSH_HOME/skills, source of anything the create_skill tool writes).
# NOT a pure add — real boot error caught the hard way confirmed dsh-base
# ALREADY has this row (`disabled: true`, patched by dsh-web-app, same
# family as the tool-web/web rows above) — a plain `insert:` for the same
# id threw "duplicate loader entry id: skill-filesystem" at real boot.
# Overriding it here instead (`disabled: false` + `bundledSkillDir`) is what
# actually turns on the empty `{"skills":[]}` real API response seen before
# this row existed. `includeDefaultRoots` (default true, left unset here) is
# what also turns on the $DSH_HOME/skills user root — confirmed by reading
# the package's own compiled source, not assumed.
- id: skill-filesystem
  name: '@deepseek-ai/dsh-skill-filesystem'
  config:
    bundledSkillDir: !!js process.env.CORDIS_BUNDLED_SKILL_DIR
  disabled: false

# 2026-09-18 — the same gap as tool-web/tool-skill above, one layer wider, found
# by deploying this repo from scratch and then just asking the agent to do
# ordinary work. Asked to create a file and read it back, it answered that the
# file had been created, quoted its contents, and named the directory — while
# calling no tool at all and leaving the workspace empty. The reason: the whole
# model-facing tool roster of dsh-base arrives `disabled: true` from
# dsh-web-app's patch layer, so the session offered exactly four tools
# (create_skill, skill, web_fetch, web_search). The sandbox and policy rows that
# GUARD file and shell access (fs-sandbox, bash-sandbox, fs-observation-policy,
# approval, permission) were all live the whole time — only the tools they guard
# were missing, which is why nothing failed loudly.
#
# A patch replaces a row's WHOLE config, so each row restates the config the
# dump shows it owning, not just `disabled`.
- id: tool-fs
  name: '@deepseek-ai/dsh-tool-fs'
  disabled: false
- id: tool-fs-search
  name: '@deepseek-ai/dsh-tool-fs-search'
  config:
    sampleOverCapGlobResults: false
  disabled: false
- id: tool-bash
  name: '@deepseek-ai/dsh-tool-bash'
  disabled: false

# `tool-bash` advertises `run_in_background` (its own default) but the base
# composition disables the job registry, so a real turn that used it got back
# "background jobs unavailable: no job controller serves this agent (load
# @deepseek-ai/dsh-tool-jobs in its composition)" — twice in a row, after which
# the model gave up and told the user to run the command in their own terminal.
# The other way out is `enableRunInBackground: false` on the row above; enabling
# the controls instead costs 273 tokens of tool descriptions (measured over
# dsh-tool-jobs' own `description:` strings), under 1% of this deployment's
# 32 K window, and keeps long-running commands usable.
- id: tool-jobs
  disabled: false

# Enabled after booting every off-by-default dsh row in a throwaway instance and
# driving each one by chat, rather than reading their descriptions and guessing.
# These three worked: the model laid out a five-step task with `todo_write` and
# moved each item pending -> in_progress -> completed as it went, and
# create_goal/get_goal answered cleanly. Cost is 297 tokens of tool descriptions,
# under 1% of the 32 K window.
#
# `todo_write` has a hidden cost worth knowing: the model re-sends the WHOLE list
# on every update, so that five-step task took six calls, roughly 770 tokens of
# churn. Worth it on long work, wasteful on short.
#
# Three others in that same test are deliberately left off:
#   - tool-workflow: the model wrote an invalid script three times running
#     ("Cannot use import statement outside a module", "require is not defined",
#     a null from the workflow globals), gave up and did the job in bash. Its 201
#     tokens buy nothing without the scripting docs dsh teaches it from elsewhere.
#   - agent-instructions: activates, but has no effect. An AGENTS.md placed in the
#     session's own cwd (tried with and without a .git marker) carrying a rule
#     trivial to check was ignored. It reads `sessionProjections.stateOf`, so the
#     gateway in this app most likely never emits the projection it waits on.
#   - skill-badge: renders in dsh's own GUI, which apps/web replaced.
# Persona. Two lines of dsh's own identity were reaching the model and both were
# wrong for this deployment, visible only once the whole prompt was assembled and
# read end to end:
#   "You are an AI agent powered by DeepSeek Harness."   (harness:identity)
#   "You are a coding agent powered by the {{model}} model."  (personaPrefix)
# The first names the framework rather than the product. The second is worse than
# cosmetic: it tells the model it is a CODING agent, while the sections below
# spend 2_000 characters teaching it to research markets and write business
# reports — the model was being told one job and asked to do another.
#
# A patch replaces a row's WHOLE config, so personaSuffix is restated verbatim
# here; dropping it would silently remove the reply-in-the-user's-language rule.
- id: system-prompt
  name: '@deepseek-ai/dsh-system-prompt'
  config:
    includeHarnessIdentity: false
    personaPrefix: You are Fox Harness, an AI agent built by FPT Telecom.
    personaSuffix: >-
      Your working directory is {{cwd}}. Always reply in the same language the
      user's message is written in — match it exactly (e.g. Vietnamese in,
      Vietnamese out; English in, English out), even if it changes
      mid-conversation, regardless of what language your own reasoning or tool
      calls use internally.

- id: tool-todo
  disabled: false
- id: tool-goal
  disabled: false
- id: command-goal
  disabled: false

# Tool output is what fills a context window once the three rows above exist:
# this trims anything past 8 KB to its head and tail in the model-visible copy,
# leaving the full text in the session log. Found independently on 2 sides of
# a merge the same day — this session's own root cause: a single huge tool
# result (e.g. an MCP call's verbose dump) is an "indivisible unit"
# dsh-compaction-basic's own README says it cannot shrink, so without this
# row a giant result that just landed could never be trimmed, only older
# history could. Not n8n-specific — harmless when no such tool is mounted.
- id: tool-result-pruner
  name: '@deepseek-ai/dsh-compaction-tool-result-pruner'
  config:
    thresholdChars: 8192
    headChars: 4096
    tailChars: 1024
  disabled: false

# Same family, found in the same pass: a chat had no compaction at all. Nothing
# trimmed a growing conversation, so a long session would keep sending the whole
# history until the model's own context window rejected it. `compaction-basic`
# needs a window size to measure against, which the openai-compat row now
# declares (packages/llm/openai-compat/cordis.patch.yml). `command-compact` is
# the matching user gesture — compact on demand instead of only at the threshold.
- id: compaction-basic
  name: '@deepseek-ai/dsh-compaction-basic'
  disabled: false
- id: command-compact
  name: '@deepseek-ai/dsh-command-compact'
  disabled: false

# Real, bigger gap found while testing the new "/" skill picker (Đợt 17):
# @deepseek-ai/dsh-tool-skill — the package that (a) surfaces the skill
# catalog + a `skill` load tool to the MODEL, and (b) implements the real
# `/name` user-gesture the composer's new picker exists to type — was ALSO
# disabled by dsh-web-app's own default, same family as tool-web/
# skill-filesystem above. Confirmed for real: sending "/web-research ..."
# never injected the skill's content at all (no extra user/message event),
# the model just treated it as plain text and called web_search directly.
# The whole skill CRUD system (Đợt 5) has been fully wired end-to-end on
# the STORAGE/UI side this whole time, but the model itself could never
# actually consume a skill — neither voluntarily nor via /name — until now.
- id: tool-skill
  name: '@deepseek-ai/dsh-tool-skill'
  disabled: false

# OpenRouter as a second, user-selectable model route alongside
# cordis-llm-openai-compat — see docs/add-openrouter-llm-plan.md for the
# research this is built from. `dsh-llm-pi-ai` is already mounted by
# dsh-base (id: llm-pi-ai, confirmed via `dsh --profile cordis-app
# --dump-config`), dormant with zero providers until a `providers` entry is
# supplied here — no new package needed. `apiKeyEnv` only names the
# credential ref; the real value is set via Settings > Config (POST
# /api/v1/credentials), same mechanism as every other key in this deployment
# — never put here. `OPENROUTER_API_KEY` was already in gateway.ts's
# KNOWN_CREDENTIAL_REFS from an earlier pass, unused until now.
- id: llm-pi-ai
  name: '@deepseek-ai/dsh-llm-pi-ai'
  config:
    providers:
      openrouter:
        apiKeyEnv: OPENROUTER_API_KEY

# cordis-llm-openai-compat, cordis-tool-serper-web-search, cordis-tool-n8n,
# and cordis-tool-create-skill moved out to their own packages (each with its
# own cordis.patch.yml) — inserted via the profile's `dsh.profile.bundles`
# array (deploy/entrypoint.sh), not from here anymore.
- insert:
    - id: cordis-ui
      name: '@cordis-app/bundle-core/ui'
    - id: cordis-auth
      name: '@cordis-app/bundle-core/auth'
    - id: cordis-gateway
      name: '@cordis-app/bundle-core/gateway'
    - id: cordis-audit
      name: '@cordis-app/bundle-core/audit'
    - id: cordis-prompt
      name: '@cordis-app/bundle-core/prompt'
    - id: cordis-resilience
      name: '@cordis-app/bundle-core/resilience'
    - id: cordis-web-clean
      name: '@cordis-app/bundle-core/web-clean'
    # User request (2026-09-23): once OPENROUTER_API_KEY is configured, n8n
    # work should prefer OpenRouter's Claude Sonnet 5 over this deployment's
    # own default model — see skill-model-preference.ts's own header for the
    # full rationale (trigger, sticky-not-reversible choice, silent no-op
    # when unconfigured).
    - id: cordis-skill-model-preference
      name: '@cordis-app/bundle-core/skill-model-preference'
